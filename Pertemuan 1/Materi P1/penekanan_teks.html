<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Penekanan Teks</title>
</head>
<body>
    <p>Penekanan penting secara makna: <strong>peringatan penting</strong></p>
    <p>Sekadar tebal (presentasional): <b>teks tebal</b></p>
    <p>Penekanan nada: saya <em>sangat</em> suka HTML</p>
    <p>Istilah asing/gaya teks: <i>web browser</i></p>
    <p>Garis bawah (hati-hati, sering dikira link): <u>teks bergaris bawah</u></p>
</body>
</html>
