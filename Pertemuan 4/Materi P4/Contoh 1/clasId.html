<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class dan ID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="header">Class dan ID</h1>

    <div class="card">
        <h2>Card 1</h2>
        <p>Class <code>.card</code> boleh dipakai berkali-kali.</p>
    </div>

    <div class="card">
        <h2>Card 2</h2>
        <p>Class ini memakai gaya yang sama dengan Card 1.</p>
    </div>

    <p id="kontak">ID <code>#kontak</code> idealnya hanya dipakai sekali per halaman.</p>
</body>
</html>
