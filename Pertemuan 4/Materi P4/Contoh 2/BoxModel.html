<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Box Model</h1>
    <p>Urutan dari dalam ke luar: content, padding, border, margin.</p>

    <div class="kotak kotak-biasa">
        Kotak tanpa border-box (width hanya mengatur content)
    </div>

    <div class="kotak kotak-border-box">
        Kotak dengan border-box (width sudah termasuk padding dan border)
    </div>
</body>
</html>
